version: "3.9"

services:
  redis:
    image: redis:7.2-alpine
    container_name: distributed-rate-limiter-redis
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: distributed-rate-limiter-app
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 7675
    depends_on:
      - redis
    ports:
      - "7675:7675"
