server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: distributed-rate-limiter
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    root: INFO
    com.example.distributedratelimiter: DEBUG
